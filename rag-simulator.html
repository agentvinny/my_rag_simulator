<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple RAG Simulator</title>
<style>
:root{--blue:#0b4ea2;--blue2:#1d7be0;--sky:#e8f3ff;--red:#e3122d;--tx:#12294a;--mu:#52688a;--line:#c9defa}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#f4f9ff,#fff 300px);color:var(--tx);font:16px/1.6 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
header{background:linear-gradient(160deg,var(--blue2),var(--blue));color:#fff;text-align:center;padding:30px 18px 26px;position:relative;overflow:hidden}
header::before{content:"";position:absolute;top:-60%;left:-10%;width:60%;height:200%;background:rgba(255,255,255,.12);transform:rotate(20deg)}
header>*{position:relative}
h1{font-size:32px;font-weight:800;letter-spacing:-.5px;margin:0}
.sub{margin:4px 0 0;opacity:.9}
.swirl{height:12px;background:repeating-linear-gradient(-45deg,var(--red) 0 14px,#fff 14px 28px,var(--blue2) 28px 42px)}
main{max-width:720px;margin:0 auto;padding:24px 18px 60px}
.box{background:#fff;border:2px solid var(--line);border-radius:22px;padding:20px;margin-bottom:18px;box-shadow:0 6px 18px rgba(11,78,162,.08)}
label{font-size:14px;font-weight:700;color:var(--blue);display:block;margin-bottom:4px}
input[type=text],select,textarea{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--sky);color:inherit;font:inherit}
input[type=checkbox]{accent-color:var(--red);width:16px;height:16px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:end;margin-top:12px}
.row>div{flex:1;min-width:140px}
button{font:inherit;font-weight:700;padding:10px 24px;border-radius:999px;border:2px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer}
button.go{background:linear-gradient(#f2384e,var(--red));border-color:var(--red);color:#fff;box-shadow:0 4px 10px rgba(227,18,45,.3)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--blue2);outline-offset:2px}
.where{font-size:14px;font-weight:700;color:var(--red)}
.bar{height:12px;background:var(--sky);border:2px solid var(--line);border-radius:999px;margin:8px 0 18px;overflow:hidden}
.bar div{height:100%;border-radius:999px;background:repeating-linear-gradient(-45deg,var(--red) 0 8px,#fff 8px 16px,var(--blue2) 16px 24px);transition:width .3s}
h2{font-size:22px;font-weight:800;color:var(--blue);margin:0 0 6px}
.why{color:var(--mu);margin:0 0 14px}
.item{border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px;font-size:15px;background:#fff}
.item small{color:var(--mu);display:block;font-weight:700}
.item.pick{border-color:var(--blue2);background:var(--sky)}
.item.pick small{color:var(--blue)}
.item.skip{opacity:.5}
code,pre{font:13px/1.6 ui-monospace,Menlo,Consolas,monospace}
pre{white-space:pre-wrap;background:var(--sky);border:2px solid var(--line);border-radius:14px;padding:14px;margin:0}
.nav{display:flex;justify-content:space-between;margin-top:18px}
.note{color:var(--mu);font-size:14px;margin-top:10px}
details summary{cursor:pointer;color:var(--blue);font-weight:700}
.tabs{display:flex;gap:8px;margin-bottom:-2px;position:relative;z-index:1}
.tab{flex:1;border-radius:18px 18px 0 0;border:2px solid var(--line);border-bottom:none;background:var(--sky);color:var(--mu);padding:12px 10px}
.tab[aria-selected=true]{background:#fff;color:var(--blue);border-color:var(--line)}
.tab[aria-selected=true]#tabA{box-shadow:inset 0 4px 0 var(--blue2)}
.tab[aria-selected=true]#tabB{box-shadow:inset 0 4px 0 var(--red)}
.panel{border-top-left-radius:0;border-top-right-radius:0}
</style>
</head>
<body>
<header>
  <h1>RAG Simulator</h1>
  <p class="sub">Click through each step to see how a question becomes an answer. The data is made up.</p>
</header>
<div class="swirl"></div>
<main>

  <div class="box">
    <label for="q">Your question</label>
    <input type="text" id="q" value="How much money did Tesla make this quarter?">
    <div class="row">
      <div><label for="n">Chunks to retrieve</label>
        <select id="n"><option>1</option><option>2</option><option selected>3</option><option>4</option></select></div>
      <div><label><input type="checkbox" id="rag" checked> Use RAG</label></div>
    </div>
    <details style="margin-top:12px"><summary>Edit the knowledge source</summary>
      <textarea id="doc" rows="8" style="margin-top:8px"></textarea>
      <p class="note">One chunk per paragraph. Leave a blank line between them.</p>
    </details>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabA">Pipeline A: Prepare knowledge</button>
    <button class="tab" role="tab" id="tabB">Pipeline B: Answer a question</button>
  </div>
  <div class="box panel" role="tabpanel">
    <div class="where" id="where"></div>
    <div class="bar"><div id="prog"></div></div>
    <div id="view"></div>
    <div class="nav"><button id="back">Back</button><button class="go" id="next">Next</button></div>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
$('doc').value=`Total revenue for Q2 was $25.5 billion, up from $23.3 billion in Q1.

Automotive revenue was $20.0 billion, with vehicle deliveries growing since Q1.

Energy storage and solar revenue was $3.4 billion.

Operating margin was 8.2 percent, lower than Q1 because of higher expenses.

Free cash flow stayed positive, and the cash balance is strong.

Management expects continued growth next quarter. Risks include tariffs and supply problems.`;

// Toy embedding: each position is a topic. Real embeddings have hundreds of numbers.
const TOPICS={money:['revenue','money','make','made','earn','income','billion','sale'],
cars:['automotive','vehicle','car','delivery','deliveries'],
energy:['energy','solar','storage','battery'],
profit:['margin','profit','expense','operating'],
cash:['cash','flow'],
outlook:['expect','guidance','growth','outlook','risk','tariff'],
stock:['stock','share','price','market']};
const KEYS=Object.keys(TOPICS);
const words=t=>t.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean).map(w=>w.length>3&&w.endsWith('s')?w.slice(0,-1):w);
const embed=t=>{const w=words(t);return KEYS.map(k=>w.filter(x=>TOPICS[k].some(y=>y.replace(/s$/,'')===x)).length)};
const cos=(a,b)=>{const d=a.reduce((s,x,i)=>s+x*b[i],0),m=Math.hypot(...a)*Math.hypot(...b);return m?d/m:0};
const fmt=v=>'['+v.join(', ')+']';

const STEPS=[
['A','Collect the data','Gather the documents the assistant should know about.'],
['A','Chunk','Split documents into small pieces so a question can find just the part it needs.'],
['A','Embed','Turn each chunk into a list of numbers that captures its meaning.'],
['A','Store','Save each chunk with its numbers. The knowledge base is now ready.'],
['B','User question','The question arrives as plain text.'],
['B','Embed the question','Turn the question into numbers, the same way as the chunks.'],
['B','Search and retrieve','Compare the question numbers with every chunk and keep the best matches.'],
['B','Build the prompt','Combine instructions, the question and the retrieved chunks into one prompt.'],
['B','Generate the answer','The LLM writes an answer from the prompt.']];
let step=0,tab="A",pos=0;

function chunks(){return $('doc').value.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean).map((t,i)=>({id:i+1,text:t,vec:embed(t)}))}
function ranked(){const qv=embed($('q').value),n=+$('n').value;
  const r=chunks().map(c=>({...c,score:cos(qv,c.vec)})).sort((a,b)=>b.score-a.score);
  r.forEach((c,i)=>c.pick=i<n&&c.score>0);return{qv,r,top:r.filter(c=>c.pick)}}

function content(){
  const C=chunks(),q=$('q').value;
  switch(step){
  case 0:return`<div class="item">Quarterly report<small>PDF</small></div><div class="item">Earnings call transcript<small>Text</small></div><div class="item">Investor presentation<small>Slides</small></div><p class="note">Here, the text in "Edit the knowledge source" stands in for these documents.</p>`;
  case 1:return`<p>${C.length} chunks:</p>`+C.map(c=>`<div class="item"><small>Chunk ${c.id}</small>${esc(c.text)}</div>`).join('');
  case 2:return C.map(c=>`<div class="item"><small>Chunk ${c.id}: ${esc(c.text.slice(0,50))}...</small><code>${fmt(c.vec)}</code></div>`).join('')+`<p class="note">Each number counts one topic: ${KEYS.join(', ')}. Chunks about similar things get similar numbers.</p>`;
  case 3:return C.map(c=>`<div class="item"><small>ID: chunk_${c.id} | Embedding: <code>${fmt(c.vec)}</code></small>${esc(c.text)}</div>`).join('')+`<p class="note">Both the numbers (for searching) and the original text (for the LLM) are kept.</p>`;
  case 4:return`<div class="item">${esc(q)}</div><p class="note">Try changing the question above, for example to ask about the share price.</p>`;
  case 5:return`<div class="item"><small>${esc(q)}</small><code>${fmt(embed(q))}</code></div><p class="note">Topics: ${KEYS.join(', ')}</p>`;
  case 6:{if(!$('rag').checked)return`<div class="item skip">RAG is off, so nothing is retrieved.</div>`;
    const{r}=ranked();return r.map(c=>`<div class="item ${c.pick?'pick':'skip'}"><small>${c.pick?'Retrieved':'Not retrieved'} | Match score ${c.score.toFixed(2)}</small>${esc(c.text)}</div>`).join('')}
  case 7:{const top=$('rag').checked?ranked().top:[];
    return`<pre>INSTRUCTIONS\nAnswer using only the context. If it is not enough, say what is missing.\n\nQUESTION\n${esc(q)}\n\nCONTEXT\n${top.length?top.map((c,i)=>`[${i+1}] ${esc(c.text)}`).join('\n'):'(none)'}</pre>`}
  case 8:{if(!$('rag').checked)return`<div class="item">I can't see your documents, so I can't give a reliable answer. I might guess or use outdated knowledge.</div><p class="note">Turn RAG on to compare.</p>`;
    const{qv,top}=ranked();
    if(!top.length)return`<div class="item">The context has nothing relevant to this question.</div>`;
    const miss=KEYS.filter((k,i)=>qv[i]>0&&!top.some(c=>c.vec[i]>0));
    return`<div class="item pick">Based on the context:<ul>${top.map((c,i)=>`<li>${esc(c.text.split(/(?<=\.)\s/)[0])} [${i+1}]</li>`).join('')}</ul>${miss.length?`<b>Missing:</b> nothing retrieved covers ${miss.join(', ')}.`:''}</div><p class="note">This answer is made by simple rules, not a real LLM.</p>`}
  }
}
const COUNT={A:4,B:5};
function render(){
  step=(tab==='A'?0:4)+pos;
  const s=STEPS[step],n=COUNT[tab];
  $('tabA').setAttribute('aria-selected',tab==='A');
  $('tabB').setAttribute('aria-selected',tab==='B');
  $('where').textContent=`Step ${pos+1} of ${n}`;
  $('prog').style.width=((pos+1)/n*100)+'%';
  $('view').innerHTML=`<h2>${s[1]}</h2><p class="why">${s[2]}</p>${content()}`;
  $('back').disabled=pos===0;
  $('next').textContent=pos===n-1?(tab==='A'?'Go to Pipeline B':'Start over'):'Next';
}
function go(t){tab=t;pos=0;render()}
$('tabA').onclick=()=>go('A');
$('tabB').onclick=()=>go('B');
$('back').onclick=()=>{pos--;render()};
$('next').onclick=()=>{if(pos<COUNT[tab]-1){pos++;render()}else go(tab==='A'?'B':'A')};
['q','n','rag','doc'].forEach(id=>$(id).addEventListener('input',render));
render();
</script>
</body>
</html>
